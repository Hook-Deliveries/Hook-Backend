set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;  set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;    set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

resolver 127.0.0.11 valid=10s ipv6=off;

geo $private_client {
  default        0;
  127.0.0.0/8    1;
  10.0.0.0/8     1;
  172.16.0.0/12  1;
  192.168.0.0/16 1;
}

map $private_client $limit_key {
  0 $binary_remote_addr;
  1 "";
}

map "$scheme:$private_client" $force_https {
  "http:0" 1;
  default  0;
}

limit_req_zone  $limit_key zone=auth:10m rate=5r/s;
limit_req_zone  $limit_key zone=api:20m  rate=30r/s;
limit_conn_zone $limit_key zone=perip:10m;

proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog:20m max_size=200m inactive=10m use_temp_path=off;

map "$http_authorization$http_cookie" $skip_cache {
  ""      0;
  default 1;
}

upstream api_pool {
  zone api_pool 64k;
  least_conn;
  server api-1:4000 resolve max_fails=3 fail_timeout=10s;
  server api-2:4000 resolve max_fails=3 fail_timeout=10s;
  server api-3:4000 resolve max_fails=3 fail_timeout=10s;
  keepalive 64;
}

upstream socket_pool {
  zone socket_pool 64k;
  hash $remote_addr consistent;
  server api-1:4000 resolve;
  server api-2:4000 resolve;
  server api-3:4000 resolve;
}

server {
  listen 80 default_server;
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  if ($force_https) { return 301 https://$host$request_uri; }

  ssl_certificate /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 85m;
  limit_conn perip 20;
  gzip on;
  gzip_types application/json text/plain text/css application/javascript;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
  server_tokens off;

  location = /metrics { return 404; }

  location = /health { access_log off; proxy_pass http://api_pool; }

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api_pool;
  }

  location ~ ^/api/v1/(webhooks|payments)/ {
    proxy_pass http://api_pool;
  }

  location ~ ^/api/v1/(products|categories|search|feed|public/banners|public/faqs)(/|$|\?) {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_cache catalog;
    proxy_cache_valid 200 10s;
    proxy_cache_bypass $skip_cache;
    proxy_no_cache $skip_cache;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_502 http_503;
    proxy_ignore_headers Cache-Control Expires;
    add_header X-Cache $upstream_cache_status always;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_pass http://api_pool;
  }

  location /socket.io/ {
    proxy_pass http://socket_pool;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
  }

  location / {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_pass http://api_pool;
  }
}
